name: Actualizar datos

on:
  schedule:
    - cron: "*/20 * * * *"     # cada 20 minutos, las 24 horas
  workflow_dispatch:            # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false     # nunca cortar una ejecución a medias: perdería el historial

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Recuperar el historial de la ejecución anterior
        run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git show origin/gh-pages:historial.json > historial.json 2>/dev/null || echo "{}" > historial.json
          else
            echo "{}" > historial.json
          fi
          echo "Historial recuperado: $(wc -c < historial.json) bytes"

      - run: python generar_web.py

      - name: Publicar la web (rama gh-pages, solo la última versión)
        run: |
          mkdir -p _sitio
          cp index.html icono.png data.json historial.json _sitio/
          touch _sitio/.nojekyll
          cd _sitio
          git init -q -b gh-pages
          git config user.name "robot-memecoins"
          git config user.email "robot-memecoins@users.noreply.github.com"
          git add -A
          git commit -q -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
